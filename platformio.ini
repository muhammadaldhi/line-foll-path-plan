[platformio]
include_dir = include

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Konfigurasi Upload & Monitor
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Partisi Flash (4MB dengan LittleFS untuk penyimpanan config/file sistem)
board_build.partitions = huge_3mb_1mb.csv


; Library Pendukung Utama
lib_deps =
    bodmer/TFT_eSPI

; Flag Build Options
build_flags = 
    -Iinclude
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
